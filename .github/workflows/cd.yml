name: CD Frontend

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, tipos e build pós-merge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  publish_ghcr:
    name: Imagem no GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O GHCR exige o nome da imagem em minúsculas.
      - name: Nome da imagem em minúsculas
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login no GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Mesma origem via gateway: VITE_API_URL vazio (variáveis VITE_* são públicas, nunca segredos).
          build-args: |
            VITE_API_URL=
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/social_flux_frontend:latest
            ghcr.io/${{ steps.img.outputs.owner }}/social_flux_frontend:${{ github.sha }}

  deploy_vps:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: publish_ghcr
    steps:
      - name: Atualizar container na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
